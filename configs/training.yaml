# Training configuration for QLoRA fine-tuning of google/gemma-3-1b-it.
#
# Defaults are intentionally conservative so this runs on a single modest GPU
# (e.g. a free/standard Google Colab T4 with ~16GB VRAM). Increase batch size
# / sequence length only if you have confirmed more VRAM is available.

# --- Model ---
model_name: "google/gemma-3-1b-it"

# --- Data ---
# Generated by scripts/webdata/build_datasets.py from the crawled Technyx
# Systems website (see data/website/, data/knowledge/). To go back to the
# small fictional demo dataset instead, point these at
# data/train/train.jsonl / data/validation/validation.jsonl (see README).
train_file: "data/datasets/train.jsonl"
validation_file: "data/datasets/validation.jsonl"

# --- Output ---
output_dir: "outputs/gemma3-1b-corporate-lora"

# --- Reproducibility ---
seed: 42

# --- Optimization ---
num_train_epochs: 3
learning_rate: 0.0002
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 0.3
optim: "paged_adamw_8bit"

# --- Batching ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true

# --- Sequence / packing ---
max_seq_length: 1024
packing: false

# --- Precision ---
# Only one of these should be true. bf16 is preferred on Ampere+ GPUs;
# fp16 is used as a fallback. Both are ignored (forced false) if no CUDA
# GPU is available.
bf16: true
fp16: false

# --- Quantization (QLoRA) ---
load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true
# "auto" resolves to bfloat16 if the GPU supports it, otherwise float16.
bnb_4bit_compute_dtype: "auto"

# --- Logging / checkpointing / evaluation ---
logging_steps: 5
save_steps: 50
eval_steps: 50
save_total_limit: 2
eval_strategy: "steps"
save_strategy: "steps"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"

# --- Reporting ---
# One of: "none", "tensorboard", "wandb"
report_to: "none"
